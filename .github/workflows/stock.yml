name: Surveillance stock

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      recap:
        description: "Envoyer un récapitulatif sur Telegram"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: stock
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests

      - name: Vérifier les stocks
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RECAP: ${{ inputs.recap }}
        run: |
          if [ "$RECAP" = "true" ]; then
            python check_stock.py --recap
          else
            python check_stock.py
          fi

      - name: Sauvegarder l'état
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "maj état" && git push)
